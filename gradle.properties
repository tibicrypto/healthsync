# Project-wide Gradle settings.

# JVM args for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Run independent module tasks in parallel.
org.gradle.parallel=true

# Reuse outputs from previous builds.
org.gradle.caching=true

# AndroidX (required by Health Connect, WorkManager, Room, Compose, etc.).
android.useAndroidX=true

# Kotlin code style.
kotlin.code.style=official

# Only build resources for modules that need them.
android.nonTransitiveRClass=true

# Silence the AGP 8.5.2 warning about compileSdk = 35 (verified working with this setup).
android.suppressUnsupportedCompileSdk=35

# Use a full JDK (with javac/jlink/jmods) for the build. The system JVM at
# /usr/lib/jvm/java-17-openjdk-amd64 is a headless JRE missing jlink, which the
# Android JdkImageTransform requires to compile generated (Hilt/Room) Java.
org.gradle.java.home=/home/tibi/jdks/jdk-17.0.13+11
