# Project-wide Gradle settings.

# JVM args for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Run independent module tasks in parallel.
org.gradle.parallel=true

# Reuse outputs from previous builds.
org.gradle.caching=true

# AndroidX (required by Health Connect, WorkManager, Room, Compose, etc.).
android.useAndroidX=true

# Kotlin code style.
kotlin.code.style=official

# Only build resources for modules that need them.
android.nonTransitiveRClass=true
