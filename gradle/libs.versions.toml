[versions]
# Build toolchain ---------------------------------------------------------
# Kotlin 2.0.21 pairs with AGP 8.5.2; the Compose compiler is supplied by the
# org.jetbrains.kotlin.plugin.compose plugin (versioned with Kotlin from 2.0).
kotlin = "2.0.21"
agp = "8.5.2"
ksp = "2.0.21-1.0.28"

# SDK levels (applied in task 1.2) ---------------------------------------
compileSdk = "35"
targetSdk = "35"
minSdk = "26"

# AndroidX / Jetpack ------------------------------------------------------
coreKtx = "1.13.1"
lifecycle = "2.8.6"
activityCompose = "1.9.2"
navigationCompose = "2.8.2"
composeBom = "2024.09.03"

# DI ----------------------------------------------------------------------
hilt = "2.52"
hiltNavigationCompose = "1.2.0"
androidxHiltWork = "1.2.0"

# Health data sources -----------------------------------------------------
healthConnect = "1.1.0-alpha07"

# Background work ---------------------------------------------------------
workManager = "2.9.1"

# Persistence -------------------------------------------------------------
room = "2.6.1"
datastore = "1.1.1"
securityCrypto = "1.1.0-alpha06"
documentfile = "1.0.1"

# Networking --------------------------------------------------------------
okhttp = "4.12.0"
retrofit = "2.11.0"

# Serialization & coroutines ---------------------------------------------
kotlinxSerialization = "1.7.3"
kotlinxCoroutines = "1.9.0"
kotlinxDatetime = "0.6.1"

# Testing -----------------------------------------------------------------
kotest = "5.9.1"
mockk = "1.13.13"
turbine = "1.2.0"
robolectric = "4.13"
junit4 = "4.13.2"
junitJupiter = "5.11.2"
androidxTestJunit = "1.2.1"
androidxTestCore = "1.6.1"

[libraries]
# --- AndroidX core / lifecycle / Compose ---------------------------------
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

# Compose BOM keeps all compose artifacts on a mutually compatible version.
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

# --- Dependency injection (Hilt) ----------------------------------------
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
hilt-android-testing = { module = "com.google.dagger:hilt-android-testing", version.ref = "hilt" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
androidx-hilt-work = { module = "androidx.hilt:hilt-work", version.ref = "androidxHiltWork" }
androidx-hilt-compiler = { module = "androidx.hilt:hilt-compiler", version.ref = "androidxHiltWork" }

# --- Health Connect ------------------------------------------------------
androidx-health-connect-client = { module = "androidx.health.connect:connect-client", version.ref = "healthConnect" }

# --- WorkManager ---------------------------------------------------------
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "workManager" }
androidx-work-testing = { module = "androidx.work:work-testing", version.ref = "workManager" }

# --- Room ----------------------------------------------------------------
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }

# --- DataStore -----------------------------------------------------------
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

# --- Jetpack Security (Android Keystore backed credential storage) -------
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }

# --- Storage Access Framework (Local Storage destination) ----------------
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }

# --- Networking ----------------------------------------------------------
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-converter-kotlinx-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }

# --- kotlinx serialization / coroutines / datetime ----------------------
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }

# --- Testing: property-based (Kotest) -----------------------------------
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }

# --- Testing: unit / mocking / flow / android ---------------------------
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
mockk-android = { module = "io.mockk:mockk-android", version.ref = "mockk" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junitJupiter" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }

[bundles]
# Compose UI artifacts pulled in via the BOM (no explicit versions).
compose-ui = [
    "androidx-compose-ui",
    "androidx-compose-ui-graphics",
    "androidx-compose-ui-tooling-preview",
    "androidx-compose-material3",
]
# Navigation + lifecycle helpers commonly used together in :app.
compose-navigation = [
    "androidx-activity-compose",
    "androidx-navigation-compose",
    "androidx-lifecycle-viewmodel-compose",
    "androidx-hilt-navigation-compose",
]
# Room runtime artifacts (compiler is added separately via ksp).
room = [
    "androidx-room-runtime",
    "androidx-room-ktx",
]
# Networking stack shared by REST API + Home Assistant destinations.
networking = [
    "okhttp",
    "okhttp-logging-interceptor",
    "retrofit",
    "retrofit-converter-kotlinx-serialization",
]
# Kotest property-based + assertion stack for pure JVM modules.
kotest = [
    "kotest-runner-junit5",
    "kotest-assertions-core",
    "kotest-property",
]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
